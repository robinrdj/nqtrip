name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is timezone-sensitive: booking dates are calendar days, and a
      # UTC runner would not catch an offset bug that only appears east of
      # Greenwich. The workspace script already pins TZ, this documents why.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Routes are code-split, so this measures the shared vendor chunk. It is
      # currently ~545KB raw / ~170KB gzipped; the budget leaves headroom for a
      # dependency or two without hiding a regression.
      - name: Check bundle size
        run: |
          BYTES=$(find frontend/dist/assets -name '*.js' -printf '%s\n' | sort -nr | head -1)
          echo "Largest JS chunk: $BYTES bytes"
          if [ "$BYTES" -gt 700000 ]; then
            echo "::error::Largest JS chunk is ${BYTES} bytes, over the 700KB budget."
            exit 1
          fi

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Only worth a browser run once the unit suite and build are green.
    needs: test

    env:
      # The API lives in its own repo. Its in-memory dev server needs no
      # database, so the whole stack comes up inside this job.
      QTRIP_BACKEND_DIR: ${{ github.workspace }}/backend-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: robinrdj/nqtripbackend
          # The API branch the frontend is tested against. Features that span
          # both repos must be merged to the API's master first.
          ref: master
          path: backend-api

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend-api/package-lock.json

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci
      - run: npm ci
        working-directory: backend-api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
